name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/...
      - name: Verify three-service SCM security boundary
        shell: pwsh
        run: ./scripts/windows-scm-security-gate.ps1

  release-race:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race-sensitive security packages
        run: bash ./scripts/run-race-security-gate.sh

  release-fuzz:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz security boundaries
        run: bash ./scripts/run-fuzz-security-gate.sh

  release-browser:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: integration/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: integration/browser/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Run browser gate
        run: pnpm test

  release-security:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-package: ./...
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-codeql:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  installers:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-windows, release-race, release-fuzz, release-browser, release-security, release-codeql]
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build single-file installers, checksums, and signed manifest
        shell: pwsh
        env:
          SCRIPTBOARD_UPDATE_KEY_ID: ${{ secrets.SCRIPTBOARD_UPDATE_KEY_ID }}
          SCRIPTBOARD_UPDATE_PUBLIC_KEY: ${{ secrets.SCRIPTBOARD_UPDATE_PUBLIC_KEY }}
          SCRIPTBOARD_UPDATE_SIGNING_KEY: ${{ secrets.SCRIPTBOARD_UPDATE_SIGNING_KEY }}
          SCRIPTBOARD_UPDATE_NEXT_KEY_ID: ${{ secrets.SCRIPTBOARD_UPDATE_NEXT_KEY_ID }}
          SCRIPTBOARD_UPDATE_NEXT_PUBLIC_KEY: ${{ secrets.SCRIPTBOARD_UPDATE_NEXT_PUBLIC_KEY }}
          SCRIPTBOARD_UPDATE_NEXT_SIGNING_KEY: ${{ secrets.SCRIPTBOARD_UPDATE_NEXT_SIGNING_KEY }}
          SCRIPTBOARD_UPDATE_REVOKED_KEY_IDS: ${{ secrets.SCRIPTBOARD_UPDATE_REVOKED_KEY_IDS }}
        run: ./scripts/build-release.ps1 -Version "${{ github.ref_name }}"
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/scriptboard-${{ github.ref_name }}-source.spdx.json
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Verify Windows amd64 binary metadata
        shell: pwsh
        run: |
          python -c "import zipfile; zipfile.ZipFile(r'dist/scriptboard-${env:GITHUB_REF_NAME}-windows-amd64-setup.exe').extractall('windows-smoke')"
          $info = & ./windows-smoke/scriptboard.exe version --json | ConvertFrom-Json
          if ($info.tag -ne $env:GITHUB_REF_NAME -or -not $info.release_build -or $info.commit -ne $env:GITHUB_SHA) {
            throw "Windows release metadata does not match the tag"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: scriptboard-installers
          path: dist/*
          if-no-files-found: error

  development-installers:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        shell: pwsh
        run: go test ./... -count=1
      - name: Build unsigned development installers
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version development
      - name: Verify development installer contract
        shell: pwsh
        run: ./scripts/verify-development-installers.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: scriptboard-development-installers
          path: dist/*
          if-no-files-found: error

  linux-smoke:
    if: startsWith(github.ref, 'refs/tags/')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scriptboard-installers
          path: dist
      - name: Verify Linux amd64 binary metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir unpacked
          chmod +x "dist/scriptboard-${GITHUB_REF_NAME}-linux-amd64.run"
          test "$("dist/scriptboard-${GITHUB_REF_NAME}-linux-amd64.run" --version-json | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')" = "$GITHUB_REF_NAME"
          python3 -c "import zipfile; zipfile.ZipFile('dist/scriptboard-${GITHUB_REF_NAME}-linux-amd64.run').extractall('unpacked')"
          chmod +x ./unpacked/scriptboard
          test "$(./unpacked/scriptboard version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')" = "$GITHUB_REF_NAME"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [installers, linux-smoke]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      # body_path is resolved in the job workspace, so publish must check out
      # the tagged release notes before creating the GitHub Release.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: scriptboard-installers
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
