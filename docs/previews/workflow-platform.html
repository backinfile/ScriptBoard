/* 单一工作流工作台：次级页签保持可见，内容使用右侧全部可用空间。 */
main{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:54px;flex:0 0 54px;padding:0 26px}
.workspace-tabs{flex:0 0 52px;display:flex;align-items:stretch;gap:28px;padding:0 26px;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.workspace-tabs button{position:relative;flex:none;gap:8px;padding:0 2px;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:12px;white-space:nowrap}
.workspace-tabs button:hover{color:var(--ink);background:transparent}
.workspace-tabs button[aria-selected="true"]{color:var(--ink);font-weight:650}
.workspace-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--blue)}
.workspace-tabs .tab-count{padding:1px 6px;border:1px solid var(--line);border-radius:5px;font:10px/1.5 Consolas,monospace;color:var(--muted);background:#f7f8fb}
.workspace-tabs button[aria-selected="true"] .tab-count{color:var(--blue);border-color:#c6d0ff;background:var(--soft)}
#app{flex:1;min-width:0;min-height:0;overflow:auto}
.content{width:100%;max-width:none;min-height:100%;margin:0;padding:26px}
.flowcontent{height:100%;min-height:0;display:flex;flex-direction:column;padding:20px 22px 22px}
.editorhead{flex:none;margin-bottom:17px}
.editor-shell{flex:1;min-height:0;height:auto;grid-template-columns:minmax(0,1fr) 300px}
.canvas-side{min-height:0}
.inspector{min-height:0}

@media(min-width:1550px){.content{padding-top:26px}.flowcontent{padding-top:20px}.editor-shell{grid-template-columns:minmax(0,1fr) 320px}}
@media(max-width:1150px){.topbar{padding:0 22px}.workspace-tabs{padding:0 22px;gap:23px}.content{padding:22px}.flowcontent{padding:18px}.editor-shell{grid-template-columns:minmax(0,1fr) 265px}}
@media(max-width:760px){
.sidebar{height:105px;padding:12px 15px}.sidebar .nav{margin-top:10px}.sidebar .nav button{flex:0 0 auto;padding:8px 12px}
main{height:calc(100vh - 105px);height:calc(100dvh - 105px)}
.topbar{height:43px;flex-basis:43px;padding:0 16px}
.workspace-tabs{flex-basis:48px;gap:22px;padding:0 16px}
.workspace-tabs button{font-size:11px}.workspace-tabs .tab-count{display:none}
.content{padding:20px 16px}.flowcontent{height:auto;min-height:100%;padding:16px}
.editor-shell{flex:none;display:flex;flex-direction:column;min-height:0}
.canvas-side{height:440px;flex:none}.inspector{max-height:420px;flex:none}
}

.view-panel{min-height:100%;height:100%}.view-panel[hidden]{display:none!important}
@media(max-width:760px){.view-panel{height:auto}}

/* 独立节点配置使用局部选择器，展开操作保持画布状态。 */
.library{overflow:visible;position:relative;z-index:6}.node-picker{position:relative}.node-picker summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 10px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:white}
.node-options{position:absolute;top:36px;left:0;display:grid;grid-template-columns:1fr 1fr;gap:5px;width:290px;padding:10px;background:white;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px #19233b20}.node-options button{justify-content:flex-start}.node p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entrygrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.entry{padding:15px 16px;overflow:visible;display:flex;flex-direction:column;gap:10px}.entry:has(details[open]){z-index:7}.entry-title{margin:0;padding-right:24px}.entry-title h3{font-size:14px}.entry .flowref{margin:0;font:11px/1.4 Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.entryfoot{margin-top:auto;padding:10px 0 0}.run-dots{display:flex;margin-left:auto;gap:3px}.run-dots button{padding:3px;border:0}.run-dots svg{width:13px;height:13px}.grouphead{cursor:pointer;list-style:none}.entry-group>.entrygrid{margin-top:10px}.entry-group{margin-bottom:24px}

/* 参数逐行对齐端口；数据连线与执行顺序分别绘制。 */
.stage{background-color:#202328;background-image:radial-gradient(#3c4049 1px,transparent 1px);background-size:22px 22px}
.node{width:290px;border-radius:9px;background:#30343b;border:1px solid #505660;color:#e1e5eb;box-shadow:0 5px 14px #0003}
.node.selected{border-color:#9eafff;box-shadow:0 0 0 2px #8c9ffb55}.node-top{height:42px;padding:8px 13px;background:#3b4350;border-radius:8px 8px 0 0}.node h3{font-size:13px}.node-icon{width:23px;height:23px;background:#535f75;color:#d6e0fc}

// 增量更新当前视图，保留节点、输入焦点、展开状态和画布滚动位置。
function domKey(node){if(node.nodeType!==1)return null;for(const name of ['id','data-node','data-entry','data-open-run','data-node-field','data-step']){const value=node.getAttribute(name);if(value)return name+':'+value}return null}
function sameNode(a,b){return a.nodeType===b.nodeType&&(a.nodeType!==1||(a.tagName===b.tagName&&domKey(a)===domKey(b)))}
function patchChildren(parent,next){
const wanted=Array.from(next.childNodes);let cursor=parent.firstChild;
for(const fresh of wanted){
let current=cursor;
if(!current||!sameNode(current,fresh)){const key=domKey(fresh);current=key?Array.from(parent.childNodes).find(n=>domKey(n)===key&&n.tagName===fresh.tagName):null;
if(current)parent.insertBefore(current,cursor);else{current=fresh.cloneNode(true);parent.insertBefore(current,cursor)}}
patchNode(current,fresh);cursor=current.nextSibling;
}
while(cursor){const next=cursor.nextSibling;parent.removeChild(cursor);cursor=next}
}
function patchNode(current,fresh){
if(current.nodeType!==1){if(current.nodeValue!==fresh.nodeValue)current.nodeValue=fresh.nodeValue;return}
const focused=current===document.activeElement;
for(const attr of Array.from(current.attributes)){if(current.tagName==='DETAILS'&&attr.name==='open')continue;if(!fresh.hasAttribute(attr.name))current.removeAttribute(attr.name)}
for(const attr of Array.from(fresh.attributes)){if(focused&&attr.name==='value')continue;if(current.getAttribute(attr.name)!==attr.value)current.setAttribute(attr.name,attr.value)}
if(current.hasAttribute('data-icon'))return;
if(focused&&['INPUT','TEXTAREA','SELECT'].includes(current.tagName))return;
patchChildren(current,fresh);
if(current.tagName==='INPUT'){if(current.value!==fresh.value)current.value=fresh.value;if(current.checked!==fresh.checked)current.checked=fresh.checked}
if(current.tagName==='TEXTAREA'&&current.value!==fresh.value)current.value=fresh.value;
if(current.tagName==='SELECT'&&current.value!==fresh.value)current.value=fresh.value;
}
const viewPanels=new Map(),viewScroll=new Map();let visibleView=null;
function updateView(markup){
const app=$('app'),switching=visibleView!==page;
if(switching&&visibleView)viewScroll.set(visibleView,app.scrollTop);
let panel=viewPanels.get(page);
if(!panel){panel=document.createElement('section');panel.className='view-panel';panel.dataset.view=page;app.appendChild(panel);viewPanels.set(page,panel)}
for(const [name,el]of viewPanels)el.hidden=name!==page;
const template=document.createElement('template');template.innerHTML=markup;patchChildren(panel,template.content);
visibleView=page;if(switching)app.scrollTop=viewScroll.get(page)||0;
}

function inputPorts(n){

}
function outputPorts(n,f=flow()){
if(n.kind==='start')return f.params.map(p=>({key:p.name,label:p.name}));
if(['literal','lookup'].includes(n.kind))return [{key:'value',label:'值'}];

}
function migratePorts(f){

if(from&&outputPorts(f.nodes.find(x=>x.id===from)||{},f).some(p=>p.key===port))f.dataEdges.push({from,out:port,to:n.id,input:target.key});
}

let wireDrag=null,createContext=null,ignorePortClickUntil=0;
const portSelector='[data-data-out],[data-data-in],[data-port-out],[data-port-in]';
function portSpec(el){if(!el)return null;const d=el.dataset;if(d.dataOut){const [node,key]=d.dataOut.split('|');return {node,key,direction:'out',mode:'data'}}if(d.dataIn){const [node,key]=d.dataIn.split('|');return {node,key,direction:'in',mode:'data'}}if(d.portOut)return {node:d.portOut,direction:'out',mode:'control'};if(d.portIn)return {node:d.portIn,direction:'in',mode:'control'};return null}
function portType(p,f=flow()){if(p.mode==='control')return 'control';const n=f.nodes.find(n=>n.id===p.node);if(!n)return 'any';let type;if(n.kind==='start')type=f.params.find(x=>x.name===p.key)?.type;else if(n.kind==='end')type=resultFields(n).find(x=>x.name===p.key)?.type;else if(n.kind==='literal')type=n.valueType;else if(n.kind==='lookup')return 'any';else if(p.direction==='in'&&nodeTypes[n.kind])type='string';else type='any';return type==='enum'?'string':type||'any'}
function compatible(a,b,f=flow()){if(!a||!b||a.mode!==b.mode||a.direction===b.direction||a.node===b.node)return false;const x=portType(a,f),y=portType(b,f);return x===y||x==='any'||y==='any'}
function connectSpecs(a,b,f=flow()){if(!compatible(a,b,f))throw Error('请选择类型兼容的相反方向端口');const out=a.direction==='out'?a:b,input=a.direction==='in'?a:b;
if(out.mode==='control'){if(!f.edges.some(e=>e[0]===out.node&&e[1]===input.node))f.edges.push([out.node,input.node])}
else{f.dataEdges=(f.dataEdges||[]).filter(e=>e.to!==input.node||e.input!==input.key);f.dataEdges.push({from:out.node,out:out.key,to:input.node,input:input.key})}graphOrder(f)}
function commitConnection(a,b){const candidate=clone(flow());connectSpecs(a,b,candidate);pushUndo();Object.assign(flow(),candidate);pendingOutput=null;connectFrom=null;persist();render()}
function nodeAt(kind,point){if(nodeTypes[kind])return typedNode(kind,'node_'+uid(),point.x,point.y);return {id:'node_'+uid(),kind,name:nodeInfo[kind]?.[0]||kind,x:point.x,y:point.y,script:'',directory:'',args:'',output:['literal','lookup'].includes(kind)?'value':kind==='condition'?'matched':'result',binding:'未绑定',valueType:'string',value:'',source:'entry',path:'branch',timeout:'1800'}}
function possiblePorts(n,direction,mode){if(mode==='control')return ['literal','lookup'].includes(n.kind)?[]:[{node:n.id,direction,mode}];return (direction==='in'?inputPorts(n):outputPorts(n)).map(p=>({node:n.id,key:p.key,direction,mode}))}
function creationChoices(query=''){const ctx=createContext;if(!ctx)return [];const kinds=['literal','lookup','script',...Object.keys(nodeTypes),'condition'];return kinds.flatMap(kind=>{const n=nodeAt(kind,ctx.point),info=nodeInfo[kind],label=info?.[0]||kind;if(!(label+' '+kind+' '+info?.[1]).toLowerCase().includes(query.toLowerCase()))return [];
if(!ctx.port)return [{kind,label}];const testFlow={...flow(),nodes:[...flow().nodes,n]};return possiblePorts(n,ctx.port.direction==='out'?'in':'out',ctx.port.mode).filter(p=>compatible(ctx.port,p,testFlow)).map(p=>({kind,label,port:p.key,mode:p.mode,direction:p.direction}))})}
function pickerElement(){let el=$('node-search-popup');if(!el){el=document.createElement('div');el.id='node-search-popup';el.className='node-search-popup';el.setAttribute('role','dialog');el.setAttribute('aria-label','搜索并添加节点');document.body.appendChild(el)}return el}

function openNodeSearch(x,y,port=null){closeNodeSearch();const rect=$('stage').getBoundingClientRect();createContext={flow:selectedFlow,port,point:{x:(x-rect.left-camera().x)/zoom,y:(y-rect.top-camera().y)/zoom}};const el=pickerElement();el.style.left=Math.max(8,Math.min(x,window.innerWidth-338))+'px';el.style.top=Math.max(8,Math.min(y,window.innerHeight-410))+'px';el.innerHTML='<div class="node-search-heading">'+(port?'创建节点并连接':'添加节点')+'<button data-close-search aria-label="关闭">'+icon('x')+'</button></div><input id="node-search-input" placeholder="搜索节点名称或类型…" autocomplete="off"><div id="node-search-results"></div><small class="node-search-help">Enter 创建第一项 · Esc 取消</small>';drawChoices();$('node-search-input').focus()}
function createChoice(c){if(!createContext||createContext.flow!==selectedFlow)return;const ctx=createContext,n=nodeAt(c.kind,ctx.point),candidate=clone(flow());candidate.nodes.push(n);if(pendingReplacement)removeLink(candidate,pendingReplacement);if(ctx.port)connectSpecs(ctx.port,{node:n.id,key:c.port,direction:c.direction,mode:c.mode},candidate);pushUndo();Object.assign(flow(),candidate);selectedNode=n.id;closeNodeSearch();selectedLink=null;pendingReplacement=null;pendingOutput=null;persist();render()}

document.addEventListener('pointerdown',e=>{if(page!=='editor'||e.button!==0)return;const el=e.target.closest(portSelector);if(!el)return;e.preventDefault();e.stopImmediatePropagation();closeNodeSearch();pendingReplacement=null;const r=el.getBoundingClientRect();wireDrag={port:portSpec(el),start:{x:r.left+r.width/2,y:r.top+r.height/2},x:e.clientX,y:e.clientY,pointer:e.pointerId,moved:false};document.querySelectorAll(portSelector).forEach(target=>{if(compatible(wireDrag.port,portSpec(target)))target.classList.add('port-compatible')})},true);

renderEdges=function(){drawBeforeSelection();const svg=$('edges'),keys=[...flow().edges.map(e=>linkKey('control',e)),...(flow().dataEdges||[]).map(e=>linkKey('data',e))];if(selectedLink&&!keys.includes(selectedLink))selectedLink=null;const paths=Array.from(svg.querySelectorAll('path'));paths.forEach((path,i)=>{const key=keys[i];if(!key)return;path.setAttribute('data-link',key);path.classList.toggle('link-selected',selectedLink===key);const hit=path.cloneNode();hit.setAttribute('class','link-hit');svg.appendChild(hit);if(key===selectedLink){const start=path.getPointAtLength(0),end=path.getPointAtLength(path.getTotalLength());svg.insertAdjacentHTML('beforeend',[['source',start],['target',end]].map(([side,p])=>'<circle class="link-handle" cx="'+p.x+'" cy="'+p.y+'" r="7" data-link-handle="'+side+'" data-link-key="'+esc(key)+'"><title>拖动修改'+(side==='source'?'来源':'目标')+'</title></circle>').join(''))}})};
commitConnection=function(a,b){const candidate=clone(flow());if(pendingReplacement)removeLink(candidate,pendingReplacement);connectSpecs(a,b,candidate);pushUndo();Object.assign(flow(),candidate);selectedLink=null;pendingReplacement=null;pendingOutput=null;connectFrom=null;persist();render()};
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-link-handle]');if(h&&e.button===0){e.preventDefault();e.stopImmediatePropagation();const ends=linkEnds(h.dataset.linkKey),fixed=h.dataset.linkHandle==='source'?ends[1]:ends[0],node=flow().nodes.find(n=>n.id===fixed.node),rect=$('stage').getBoundingClientRect();pendingReplacement=h.dataset.linkKey;wireDrag={port:fixed,start:{x:rect.left+camera().x+(node.x+(fixed.direction==='out'?290:0))*zoom,y:rect.top+camera().y+(fixed.mode==='data'?portY(node,fixed.key,fixed.direction):node.y+57)*zoom},x:e.clientX,y:e.clientY,pointer:e.pointerId,moved:false};return}if(e.target.closest('[data-link]')){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('click',e=>{const hit=e.target.closest('[data-link]');if(!hit)return;e.preventDefault();e.stopImmediatePropagation();selectedLink=hit.dataset.link;selectedNode=null;render();toast('连线已选中：拖动端点修改，Delete / Backspace 删除')},true);
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||$('dialog').open)return;if(page==='editor'&&selectedLink&&['Delete','Backspace'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();pushUndo();removeLink(flow(),selectedLink);selectedLink=null;pendingReplacement=null;persist();render()}if(e.key==='Escape'){selectedLink=null;pendingReplacement=null;if(page==='editor')render()}},true);
document.addEventListener('pointercancel',()=>{pendingReplacement=null},true);


function initCustomNodes(){if(!state.customNodes)state.customNodes=[{id:'normalize_version',name:'规范化版本',revision:1,description:'移除版本号前缀 v，返回规范化版本。',language:'python',inputs:[{name:'version',type:'string',required:true,value:'v1.0.0'}],outputs:[{name:'version',type:'string'}],code:'def main(inputs):\n    return {"version": inputs["version"].removeprefix("v")}\n'}];}
initCustomNodes();
let customDraft=clone(state.customNodes[0]||{id:'',name:'',description:'',language:'python',inputs:[],outputs:[],code:'def main(inputs):\n    return {}\n'}),customDirty=false;
function registerCustomNodes(){const previous=nodeGroups.find(g=>g.name==='自定义');if(previous)for(const k of previous.kinds){delete nodeTypes[k];delete nodeInfo[k]}const kinds=[];for(const d of state.customNodes){const kind='custom_'+d.id;kinds.push(kind);nodeTypes[kind]={name:d.name,icon:'terminal',output:d.outputs.map(p=>p.name).join(', '),fields:d.inputs.map(p=>[p.name,p.name,p.value??''])};nodeInfo[kind]=[d.name,'自定义',d.description||'由 ScriptBoard 托管脚本的自定义节点。','根据输入类型配置或连线；脚本接收 inputs 并返回与输出定义对应的对象。实例固定使用添加时的脚本修订。']}if(previous)previous.kinds=kinds;else nodeGroups.push({name:'自定义',icon:'terminal',kinds})}
registerCustomNodes();
function customSchemaRows(side){return customDraft[side].map((p,i)=>'<div class="custom-schema-row" data-custom-row="'+side+'-'+i+'"><input aria-label="参数名称" placeholder="参数名" data-custom-side="'+side+'" data-custom-index="'+i+'" data-custom-prop="name" value="'+esc(p.name)+'"><select aria-label="参数类型" data-custom-side="'+side+'" data-custom-index="'+i+'" data-custom-prop="type">'+['string','number','boolean','json'].map(t=>'<option '+(p.type===t?'selected':'')+'>'+t+'</option>').join('')+'</select>'+(side==='inputs'?'<label class="row"><input type="checkbox" data-custom-side="'+side+'" data-custom-index="'+i+'" data-custom-prop="required" '+(p.required?'checked':'')+'>必填</label><input placeholder="默认值（可空）" aria-label="默认值" data-custom-side="'+side+'" data-custom-index="'+i+'" data-custom-prop="value" value="'+esc(p.value??'')+'">':'')+'<button class="quiet icon" data-action="custom-remove-field" data-side="'+side+'" data-index="'+i+'" aria-label="删除参数">'+icon('trash')+'</button></div>').join('')}
function customView(){return '<div class="content"><div class="pagehead"><div><h1>自定义节点</h1><p>编写脚本并定义输入输出，保存后即可用于工作流编排。</p></div><button data-action="custom-new">'+icon('plus')+'新建节点</button></div><div class="custom-layout"><aside class="custom-list">'+state.customNodes.map(d=>'<button data-action="custom-select" data-id="'+d.id+'" class="'+(customDraft.id===d.id?'active':'')+'"><strong>'+esc(d.name)+'</strong><small>'+esc(d.language)+' · v'+d.revision+'</small></button>').join('')+'</aside><div class="custom-editor"><div class="row between"><span class="badge blue">ScriptBoard 托管脚本</span><button class="primary" data-action="custom-save">保存节点版本</button></div><div class="grid2" style="margin-top:18px"><label class="field">节点名称<input data-custom-field="name" value="'+esc(customDraft.name)+'"></label><label class="field">运行语言<select data-custom-field="language">'+['python','javascript','shell','powershell'].map(l=>'<option '+(customDraft.language===l?'selected':'')+'>'+l+'</option>').join('')+'</select></label></div><label class="field">节点说明<textarea data-custom-field="description">'+esc(customDraft.description)+'</textarea></label><div class="row between"><h3>输入参数</h3><button data-action="custom-add-field" data-side="inputs">'+icon('plus')+'添加输入</button></div><div class="custom-schema">'+customSchemaRows('inputs')+'</div><div class="row between"><h3>输出参数</h3><button data-action="custom-add-field" data-side="outputs">'+icon('plus')+'添加输出</button></div><div class="custom-schema">'+customSchemaRows('outputs')+'</div><label class="field">脚本内容<textarea class="custom-code" spellcheck="false" data-custom-field="code">'+esc(customDraft.code)+'</textarea></label><p class="editor-note">'+(customDraft.language==='python'?'Python：定义 main(inputs)，返回字典。':customDraft.language==='javascript'?'JavaScript：导出 async function main(inputs)，返回对象。':'Shell / PowerShell：从 SCRIPTBOARD_INPUT_FILE 读取 JSON，将结果 JSON 写入 SCRIPTBOARD_OUTPUT_FILE；stdout/stderr 用于日志。')+'</p><div class="notice" style="margin-top:16px">产品设计：脚本内容与版本由 ScriptBoard 服务端保存，无需填写本地脚本路径。当前为独立预览，保存仅模拟于浏览器，不会上传或执行脚本。</div></div></div></div>'}
function validateCustom(d){if(!d.name.trim()||!d.code.trim())throw Error('请填写节点名称和脚本内容');for(const side of ['inputs','outputs']){const fields=d[side];if(fields.some(p=>!/^[a-zA-Z_]\w*$/.test(p.name))||new Set(fields.map(p=>p.name)).size!==fields.length)throw Error('参数名称须唯一，且使用字母、数字和下划线');for(const p of fields){if(!['string','number','boolean','json'].includes(p.type))throw Error('参数类型无效');if(side==='inputs'&&p.value!==''){if(p.type==='number'&&!Number.isFinite(Number(p.value)))throw Error(p.name+' 默认值需要数字');if(p.type==='boolean'&&!['true','false'].includes(p.value))throw Error(p.name+' 默认值需要 true 或 false');if(p.type==='json')try{JSON.parse(p.value)}catch{throw Error(p.name+' 默认值需要有效 JSON')}}}}}
function saveCustom(){validateCustom(customDraft);const old=state.customNodes.find(d=>d.id===customDraft.id),saved={...clone(customDraft),id:customDraft.id||uid(),revision:(old?.revision||0)+1};if(old)state.customNodes[state.customNodes.indexOf(old)]=saved;else state.customNodes.push(saved);customDraft=clone(saved);customDirty=false;registerCustomNodes();persist();render();toast('节点版本已保存，可在“自定义”分组添加；现有实例保留原版本')}
const nativeTypedNode=typedNode;
typedNode=function(kind,id,x,y){const n=nativeTypedNode(kind,id,x,y);if(kind.startsWith('custom_'))n.definition=clone(state.customNodes.find(d=>'custom_'+d.id===kind));return n};
const nativeInputs=inputPorts,nativeOutputs=outputPorts,nativePortType=portType;
inputPorts=function(n){return n.definition?n.definition.inputs.map(p=>({key:p.name,label:p.name})):nativeInputs(n)};
outputPorts=function(n,f=flow()){return n.definition?n.definition.outputs.map(p=>({key:p.name,label:p.name})):nativeOutputs(n,f)};
portType=function(p,f=flow()){const n=f.nodes.find(n=>n.id===p.node);if(n?.definition&&p.mode==='data')return n.definition[p.direction==='in'?'inputs':'outputs'].find(x=>x.name===p.key)?.type||'any';return nativePortType(p,f)};
const nativeTypeFields=typeFields;
typeFields=function(n){if(!n.definition)return nativeTypeFields(n);return '<span class="badge blue">托管脚本 · '+esc(n.definition.language)+' · v'+n.definition.revision+'</span>'+n.definition.inputs.map(p=>{const bound=(flow().dataEdges||[]).find(e=>e.to===n.id&&e.input===p.name);return '<label class="field">'+esc(p.name)+' · '+esc(p.type)+(p.required?' · 必填':' · 可选')+(bound?'<code class="binding">'+esc(bound.from+'.'+bound.out)+'</code>':'<input data-node-field="'+esc(p.name)+'" value="'+esc(n[p.name]??'')+'">')+'</label>'}).join('')+'<details style="margin-top:16px"><summary>查看脚本快照</summary><pre class="script-snapshot">'+esc(n.definition.code)+'</pre></details>'};
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.customField){customDraft[d.customField]=e.target.value;customDirty=true}if(d.customSide){customDraft[d.customSide][Number(d.customIndex)][d.customProp]=d.customProp==='required'?e.target.checked:e.target.value;customDirty=true}});
document.addEventListener('change',e=>{if(e.target.dataset.customField==='language')render()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='custom-save'){try{saveCustom()}catch(err){toast(err.message)}}if(a==='custom-add-field'){customDraft[b.dataset.side].push({name:'',type:'string',required:false,value:''});customDirty=true;render()}if(a==='custom-remove-field'){customDraft[b.dataset.side].splice(Number(b.dataset.index),1);customDirty=true;render()}if(a==='custom-select'||a==='custom-new'){if(customDirty){show('保存当前草稿','<p>保存当前节点后再切换，或放弃未保存的修改。</p>','<button data-action="close">继续编辑</button><button data-action="custom-switch" data-id="'+(a==='custom-new'?'':b.dataset.id)+'">放弃并切换</button>');return}switchCustom(a==='custom-new'?'':b.dataset.id)}if(a==='custom-switch'){$('dialog').close();switchCustom(b.dataset.id)}});
function switchCustom(id){customDraft=id?clone(state.customNodes.find(d=>d.id===id)):{id:'',name:'',description:'',language:'python',inputs:[],outputs:[],code:'def main(inputs):\n    return {}\n'};customDirty=false;render()}


const customEditorView=customView;
let customDrawerOpen=false;
customView=function(){return '<div class="content"><div class="pagehead"><div><h1>自定义节点</h1><p>'+state.customNodes.length+' 个节点 · 脚本由 ScriptBoard 托管</p></div><button class="primary" data-action="custom-new">'+icon('plus')+'创建自定义节点</button></div>'+(state.customNodes.length?'<div class="entrygrid custom-node-grid">'+state.customNodes.map(d=>'<article class="entry custom-node-card" id="custom-card-'+esc(d.id)+'"><div class="entry-title"><h3>'+esc(d.name)+'</h3></div><p class="custom-card-description" title="'+esc(d.description||'暂无说明')+'">'+esc(d.description||'暂无说明')+'</p><div class="row wrap"><span class="badge">'+esc(d.language)+'</span><span class="badge">v'+d.revision+'</span></div><div class="entryfoot"><small>'+d.inputs.length+' 个输入 · '+d.outputs.length+' 个输出</small><button data-action="custom-select" data-id="'+esc(d.id)+'">'+icon('edit')+'编辑</button></div></article>').join('')+'</div>':'<div class="empty">'+icon('terminal')+'<p>还没有自定义节点</p><button data-action="custom-new" style="margin-top:16px">创建自定义节点</button></div>')+'</div>'};

function customDrawerMarkup(){const full=customEditorView(),start=full.indexOf('<div class="custom-editor">');const fields=full.slice(start).replace(/<\/div><\/div><\/div>$/,'</div>').replace('<button class="primary" data-action="custom-save">保存节点版本</button>','');return '<div class="drawer-head"><div><h2 id="custom-drawer-title">'+(customDraft.id?'编辑自定义节点':'创建自定义节点')+'</h2><p>定义输入输出，并编写托管脚本。</p></div><button class="quiet icon" data-action="custom-drawer-close" aria-label="关闭抽屉">'+icon('x')+'</button></div><div class="drawer-body">'+fields+'</div><div class="drawer-foot"><button data-action="custom-drawer-close">取消</button><button class="primary" data-action="custom-save">'+(customDraft.id?'保存新版本':'创建节点')+'</button></div>'}
function updateCustomDrawer(){const drawer=$('custom-drawer');if(!customDrawerOpen)return;const template=document.createElement('template');template.innerHTML=customDrawerMarkup();patchChildren(drawer,template.content)}
const renderBeforeDrawer=render;
render=function(){renderBeforeDrawer();updateCustomDrawer()};
const switchBeforeDrawer=switchCustom;
switchCustom=function(id){switchBeforeDrawer(id);customDrawerOpen=true;updateCustomDrawer();if(!$('custom-drawer').open)$('custom-drawer').showModal();$('custom-drawer').querySelector('[data-custom-field="name"]')?.focus()};
function closeCustomDrawer(){customDrawerOpen=false;$('custom-drawer').close();customDirty=false;render()}
function requestCloseDrawer(){if(customDirty){show('放弃未保存的修改？','<p>关闭后，本次未保存的参数和脚本修改将被丢弃。</p>','<button data-action="close">继续编辑</button><button data-action="custom-discard-close">放弃并关闭</button>')}else closeCustomDrawer()}
const saveBeforeDrawer=saveCustom;
saveCustom=function(){saveBeforeDrawer();closeCustomDrawer()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b?.dataset.action==='custom-drawer-close')requestCloseDrawer();if(b?.dataset.action==='custom-discard-close'){$('dialog').close();closeCustomDrawer()}if(e.target===$('custom-drawer')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)requestCloseDrawer()}});
$('custom-drawer').addEventListener('cancel',e=>{e.preventDefault();requestCloseDrawer()});

icons();render();
</script></body></html>
