<!doctype html>
<html lang="{{.Locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/app.css?v={{assetVersion}}">
  <script defer src="/assets/app-v2.js?v={{assetVersion}}"></script>
  <title>{{t .Locale "delete_impact.title"}} · ScriptBoard</title>
</head>
<body>
<main class="workspace confirmation-page">
  <span class="confirmation-icon" data-lucide="triangle-alert" aria-hidden="true"></span>
  <h1>{{t .Locale "delete_impact.title"}}</h1>
  <p>{{t .Locale "delete_impact.description"}}</p>
  <dl class="confirmation-facts">
    <div><dt>{{t .Locale "common.path"}}</dt><dd><code>{{.Path}}</code></dd></div>
    <div><dt>{{t .Locale "quick_runs.title"}}</dt><dd>{{.QuickRuns}}</dd></div>
    <div><dt>{{t .Locale "schedules.title"}}</dt><dd>{{.Schedules}}</dd></div>
  </dl>
  <form method="post" action="/resources/files/delete" data-async>
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="path" value="{{.Path}}">
    <button class="button button--danger" type="submit" name="confirm_references" value="yes">{{t .Locale "delete_impact.confirm"}}</button>
  </form>
</main>
</body>
</html>
