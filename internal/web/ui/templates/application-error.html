<!doctype html>
<html lang="{{.Locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/app.css?v={{assetVersion}}">
  <script defer src="/assets/app-v2.js?v={{assetVersion}}"></script>
  <title>{{t .Locale "error.title"}} · ScriptBoard</title>
</head>
<body>
<main class="workspace error-page">
  <p class="error-code page-eyebrow">HTTP {{.Status}}</p>
  <h1>{{t .Locale "error.title"}}</h1>
  <div class="page-error" role="alert">{{.Summary}}</div>
  <details class="ledger-disclosure">
    <summary><span>{{t .Locale "error.technical_details"}}</span></summary>
    <div class="disclosure-body"><code>{{.Message}}</code></div>
  </details>
  <p><a class="button button--primary" href="{{.Destination}}"><span data-lucide="arrow-left" aria-hidden="true"></span>{{t .Locale "error.return"}}</a></p>
</main>
</body>
</html>
