<!doctype html>
<html lang="{{.Locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/app.css?v={{assetVersion}}">
  <script defer src="/assets/app-v2.js?v={{assetVersion}}"></script>
  <title>{{t .Locale "editor.edit_title"}} · ScriptBoard</title>
</head>
<body>
<main class="workspace editor-page">
  <header class="page-heading">
    <div>
      <a class="task-back" href="{{.BackURL}}"><span data-lucide="arrow-left" aria-hidden="true"></span>{{t .Locale .BackLabel}}</a>
      <p class="page-eyebrow">{{t .Locale "files.eyebrow"}}</p>
      <h1>{{t .Locale "editor.edit_title"}}</h1>
      <p><code title="{{.Path}}">{{.Path}}</code></p>
    </div>
    <div class="heading-actions">
      <a class="button" href="{{.ViewURL}}">{{t .Locale "editor.read_only"}}</a>
      <a class="button" href="{{.DownloadURL}}" data-native><span data-lucide="download" aria-hidden="true"></span>{{t .Locale "common.download"}}</a>
    </div>
  </header>
  <form class="text-editor-form" method="post" action="{{.Action}}" data-async>
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="digest" value="{{.Digest}}">
    <div class="editor-surface">
      <div class="editor-surface__bar"><span>UTF-8</span><span>{{t .Locale "editor.size_limit"}}</span></div>
      <label class="sr-only" for="file-content">{{t .Locale "editor.content"}}</label>
      <textarea id="file-content" name="content" autocomplete="off" spellcheck="false" required>{{.Content}}</textarea>
    </div>
    <footer class="editor-actions">
      <span>{{t .Locale "editor.save_notice"}}</span>
      <a class="button button--quiet" href="{{.BackURL}}">{{t .Locale "common.cancel"}}</a>
      <button class="button button--primary" type="submit">{{t .Locale "editor.save_file"}}</button>
    </footer>
  </form>
</main>
</body>
</html>
