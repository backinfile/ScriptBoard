<!doctype html><html lang="{{.Locale}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/app.css?v={{assetVersion}}"><script defer src="/assets/app-v2.js?v={{assetVersion}}"></script><title>{{t .Locale "overlap.title"}} · ScriptBoard</title></head><body><main class="workspace confirmation-page"><span class="confirmation-icon" data-lucide="copy" aria-hidden="true"></span><h1>{{t .Locale "overlap.title"}}</h1><p>{{t .Locale "overlap.description"}}</p><code>{{.Script}}</code><form method="post" action="{{.Action}}"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><input type="hidden" name="script" value="{{.Script}}"><input type="hidden" name="arguments" value="{{.Arguments}}"><input type="hidden" name="timeout_seconds" value="{{.Timeout}}"><button class="button button--primary" type="submit" name="confirm_overlap" value="yes">{{t .Locale "overlap.confirm"}}</button></form></main></body></html>
