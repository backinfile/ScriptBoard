<!doctype html>
<html lang="{{.Locale}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/app.css?v={{assetVersion}}"><script defer src="/assets/app-v2.js?v={{assetVersion}}"></script><title>{{t .Locale "upload_results.title"}} · ScriptBoard</title></head>
<body>
<main class="workspace upload-results-page" data-upload-results data-refresh-url="{{.Link}}">
  <section class="upload-results-sheet" aria-labelledby="upload-results-title">
    <header>
      <span class="upload-results-mark"><span data-lucide="files" aria-hidden="true"></span></span>
      <div><p class="page-eyebrow">{{t .Locale "upload_results.eyebrow"}}</p><h1 id="upload-results-title">{{t .Locale "upload_results.title"}}</h1></div>
      <a class="icon-button icon-button--quiet" href="{{.Link}}" data-upload-results-close aria-label="{{t .Locale "common.close"}}"><span data-lucide="x" aria-hidden="true"></span></a>
    </header>
    <div class="table-shell"><table><thead><tr><th>{{t .Locale "common.name"}}</th><th>{{t .Locale "common.result"}}</th><th>{{t .Locale "common.details"}}</th></tr></thead><tbody>{{range .Results}}<tr><td><strong>{{.Name}}</strong></td><td><span class="status-chip" data-state="{{if .Succeeded}}succeeded{{else}}attention{{end}}"><span class="status-dot" aria-hidden="true"></span>{{.Result}}</span></td><td>{{.Detail}}</td></tr>{{end}}</tbody></table></div>
    <footer><a class="button button--primary" href="{{.Link}}" data-upload-results-close>{{t .Locale "common.close"}}</a></footer>
  </section>
</main>
</body>
</html>
