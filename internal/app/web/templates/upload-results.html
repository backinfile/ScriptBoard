<!doctype html>
<html lang="{{.Locale}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/app.css?v={{assetVersion}}"><script defer src="/assets/app-v2.js?v={{assetVersion}}"></script><title>{{t .Locale "upload_results.title"}} · ScriptBoard</title></head><body><main class="workspace"><header class="page-heading"><div><p class="page-eyebrow">{{t .Locale "upload_results.eyebrow"}}</p><h1>{{t .Locale "upload_results.title"}}</h1></div></header><div class="table-shell"><table><thead><tr><th>{{t .Locale "common.name"}}</th><th>{{t .Locale "common.result"}}</th><th>{{t .Locale "common.details"}}</th></tr></thead><tbody>{{range .Results}}<tr><td>{{.Name}}</td><td>{{.Result}}</td><td>{{.Detail}}</td></tr>{{end}}</tbody></table></div><p><a class="button button--primary" href="{{.Link}}">{{t .Locale "trash.back_to_files"}}</a></p></main></body></html>
